spring.application.name=veterinaria-integradora
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/veterinaria_integradora?useSSL=false&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Seguridad de la API
app.auth.horas-vigencia-token=8
app.admin.correo=${ADMIN_CORREO:admin@veterinaria.mx}
app.admin.contrasena=${ADMIN_CONTRASENA:Admin1234}
